# One command on a new machine:
#   cp .env.example .env   # fill OPENAI_API_KEY, OPENAI_BASE_URL, MODEL_ID
#   docker compose up --build
# Desk: http://127.0.0.1:8080/
#
# One container: backend + frontend + SQLite. Optional Postgres: --profile postgres

services:
  app:
    build: .
    image: agentshield:local
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      FAKE_DECIDER: ${FAKE_DECIDER:-1}
      DECIDER_URL: ${DECIDER_URL:-http://host.docker.internal:8099}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/agentshield.db}
    volumes:
      - agentshield_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: agentshield
      POSTGRES_PASSWORD: agentshield
      POSTGRES_DB: agentshield
    ports:
      - "5432:5432"
    volumes:
      - agentshield_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshield -d agentshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentshield_data:
  agentshield_pg:
