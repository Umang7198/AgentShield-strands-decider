<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hearth &amp; Cable · ShopHelp</title>
<style>
:root {
  --bg: #f4f1ea; --ink: #1c1915; --muted: #6b6258; --line: #ddd6cb;
  --paper: #fffcf7; --allow: #1f7a4d; --clarify: #9a6700; --block: #b42318;
  --approval: #6941c6; --maya: #1d4e89; --priya: #6941c6;
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font: 13px/1.45 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
}
header {
  display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
  padding: .7rem 1rem; border-bottom: 1px solid var(--line); background: var(--paper);
}
header h1 { font-size: 15px; margin: 0; }
header .meta { color: var(--muted); }
.scenes { display: flex; flex-wrap: wrap; gap: .35rem; padding: .6rem 1rem; }
.scenes button, .desk button, .chat-row button {
  font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--paper);
  border-radius: 6px; padding: .25rem .55rem;
}
.scenes button:hover, .desk button:hover { border-color: #bbb; }
.grid {
  display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.1fr;
  gap: .7rem; padding: 0 1rem 1rem; min-height: calc(100vh - 8rem);
}
@media (max-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
.pane {
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; min-height: 22rem; overflow: hidden;
}
.pane h2 {
  margin: 0; padding: .55rem .8rem; font-size: 12px; letter-spacing: .04em;
  text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line);
}
.scroll { flex: 1; overflow: auto; padding: .7rem .8rem; }
.bubble { margin: 0 0 .55rem; padding: .45rem .6rem; border-radius: 8px; }
.bubble.user { background: #ece7dc; }
.bubble.assistant { background: #e8eef6; }
.bubble.system { background: #efe8fb; color: var(--priya); }
.bubble.gate { background: #fde8e6; color: var(--block); }
.role { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.chat-row { display: flex; gap: .4rem; padding: .5rem .6rem; border-top: 1px solid var(--line); }
.chat-row input { flex: 1; font: inherit; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: 6px; }
.row { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .6rem; margin: 0 0 .5rem; }
.tag {
  display: inline-block; font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
  padding: .1rem .35rem; border-radius: 4px; color: #fff; margin-right: .3rem;
}
.tag.allow { background: var(--allow); }
.tag.clarify { background: var(--clarify); }
.tag.block { background: var(--block); }
.tag.require_approval { background: var(--approval); }
.muted { color: var(--muted); }
pre { white-space: pre-wrap; margin: .35rem 0 0; font: 11px/1.4 ui-monospace, monospace; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: .25rem .2rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.toolbar { padding: .45rem .8rem; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1 id="store">Hearth &amp; Cable</h1>
  <span class="meta" id="seats">ShopHelp · Maya · supervisor Priya</span>
  <span class="meta" id="today"></span>
  <button type="button" onclick="resetWorld()">Reset catalogue</button>
</header>
<div class="scenes" id="scenes"></div>
<div class="grid">
  <section class="pane">
    <h2>Customer chat</h2>
    <div class="scroll" id="transcript"></div>
    <div class="chat-row">
      <input id="prompt" placeholder="Message as Sam or Ann…" onkeydown="if(event.key==='Enter') send()"/>
      <button type="button" onclick="send()">Send</button>
    </div>
  </section>
  <section class="pane">
    <h2>Gate tape</h2>
    <div class="scroll" id="tape"></div>
  </section>
  <section class="pane">
    <h2>Supervisor desk · Priya</h2>
    <div class="scroll" id="desk"></div>
  </section>
  <section class="pane">
    <h2>Ops board</h2>
    <div class="scroll" id="board"></div>
  </section>
</div>
<script>
const token = localStorage.getItem("approval_token") || "";
const approver = localStorage.getItem("approver") || "Priya";
localStorage.setItem("approver", approver);

function headers() {
  const h = {"Content-Type": "application/json", "X-Approver-Id": approver};
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}
async function api(path, opts) {
  const r = await fetch(path, {headers: headers(), ...opts});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function paint(state) {
  window.STATE = state;
  document.getElementById("prompt").disabled = !!state.paused;
  document.getElementById("store").textContent = state.store || "Hearth & Cable";
  document.getElementById("seats").textContent =
    `ShopHelp · ${state.agent} · supervisor ${state.supervisor}`;
  document.getElementById("today").textContent = "today " + (state.today || "");
  window.SCENES = {};
  (state.scenes || []).forEach(s => { window.SCENES[s.id] = s; });
  document.getElementById("scenes").innerHTML = (state.scenes || []).map(s =>
    `<button type="button" title="${esc(s.note)}" onclick="playScene('${s.id}')">${esc(s.title)}</button>`
  ).join("");
  const t = document.getElementById("transcript");
  t.innerHTML = (state.transcript || []).map(m =>
    `<div class="bubble ${m.role}"><div class="role">${esc(m.role)}</div>${esc(m.text)}</div>`
  ).join("") || `<p class="muted">Maya is waiting. Play a scene or type as the customer.</p>`;
  t.scrollTop = t.scrollHeight;
  document.getElementById("tape").innerHTML = (state.tape || []).slice().reverse().map(row =>
    `<div class="row"><span class="tag ${row.outcome}">${esc(row.outcome)}</span>
     <strong>${esc(row.tool)}</strong> · ${esc(row.source)} · ${row.total_ms}ms
     <div class="muted">${esc(row.reason)}</div></div>`
  ).join("") || `<p class="muted">Every ALLOW / CLARIFY / REQUIRE_APPROVAL / BLOCK lands here.</p>`;
  const pending = state.pending || [];
  document.getElementById("desk").innerHTML = pending.length ? pending.map(card).join("") :
    `<p class="muted">Nothing waiting. High-risk refunds and shipped address changes pause here.</p>`;
  const b = state.board || {};
  const orders = (b.orders || []).map(o =>
    `<tr><td>${esc(o.order_id)}</td><td>${esc(o.status)}</td><td>$${o.total}</td>
     <td>left $${o.refundable_remaining}</td><td>${esc(o.items)}</td></tr>`
  ).join("");
  const refunds = (b.refunds || []).map(r => `${r.order_id} $${r.amount}`).join(", ") || "none";
  const emails = (b.emails || []).map(e => e.to).join(", ") || "empty";
  document.getElementById("board").innerHTML = `
    <table><thead><tr><th>Order</th><th>Status</th><th>Total</th><th>Refundable</th><th>Item</th></tr></thead>
    <tbody>${orders}</tbody></table>
    <p class="muted">Ledger: ${esc(refunds)}. Outbox: ${esc(emails)}.</p>`;
}
function card(a) {
  return `<div class="row">
    <strong>${esc(a.tool)}</strong> · ${esc(a.risk)} · ${esc(a.source)}
    <div class="muted">${esc(a.reason)}</div>
    <pre>${esc(JSON.stringify(a.arguments, null, 2))}</pre>
    <pre>${esc(a.excerpt || "")}</pre>
    <button type="button" onclick="decide('${a.id}','approve')">Approve</button>
    <button type="button" onclick="decide('${a.id}','deny')">Deny</button>
  </div>`;
}
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
async function playScene(id) {
  const scene = (window.SCENES || {})[id];
  if (scene) await play(scene);
}
async function refresh() { paint(await api("/demo/state")); }
async function send() {
  const el = document.getElementById("prompt");
  const text = el.value.trim();
  if (!text) return;
  el.value = "";
  paint(await api("/demo/chat", {method: "POST", body: JSON.stringify({text})}));
}
async function play(scene) {
  if (window.STATE && window.STATE.paused && scene.kind !== "claim") {
    return;
  }
  if (scene.kind === "claim") {
    paint(await api("/demo/claim", {method: "POST", body: JSON.stringify({claim: scene.prompt})}));
    return;
  }
  document.getElementById("prompt").value = scene.prompt;
  await send();
}
async function decide(id, action) {
  paint(await api("/demo/" + action + "/" + id, {method: "POST", body: JSON.stringify({approver, note: ""})}));
}
async function resetWorld() {
  if (!confirm("Reset orders, chat, tape and pending approvals?")) return;
  paint(await api("/demo/reset", {method: "POST"}));
}
refresh().catch(err => { document.getElementById("transcript").textContent = err.message; });
</script>
</body>
</html>
